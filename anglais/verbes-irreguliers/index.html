<style>
/* Une colonne posée sur une page de cahier Seyès ; chaque jeu est une fiche bristol (marge rouge en haut, lignes bleues). La nuit, le cahier devient une ardoise. */
:root{
  --paper:#F4F7FC;
  --sheet:#FFFFFF;
  --rule:#E3EAF6;
  --rule-strong:#CBD8EF;
  --card-rule:#DCE5F5;
  --margin:#E05A6C;

  --muted:#5B6488;
  --line:#CDD6EA;
  --pen:#2340C4;
  --pen-soft:#E2E8FF;
  --red:#CC2D2A;
  --red-soft:#FCE6E5;
  --ok:#0F8456;
  --ok-soft:#DAF3E6;
  --hl-1:#C2F4A0;
  --hl-2:#FFD98C;
  --hl-3:#FFB6D9;
  --lv-1:#3E9B3A;
  --lv-2:#D98A00;
  --lv-3:#D23F86;
  --shadow:rgba(26,34,80,.10);

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13201E; --sheet:#1B2B29; --rule:rgba(210,235,226,.045); --rule-strong:rgba(210,235,226,.09); --card-rule:rgba(210,235,226,.08);
    --margin:#C95A69; --ink:#E9F1EE; --muted:#9CB1AA; --line:rgba(210,235,226,.16); --pen:#9DB5FF; --pen-soft:rgba(157,181,255,.16);
    --red:#FF857C; --red-soft:rgba(255,133,124,.13); --ok:#62D9A2; --ok-soft:rgba(98,217,162,.13);
    --hl-1:#2E5627; --hl-2:#674A17; --hl-3:#68294A; --lv-1:#74C96A; --lv-2:#F2B13F; --lv-3:#F27DB8; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13201E; --sheet:#1B2B29; --rule:rgba(210,235,226,.045); --rule-strong:rgba(210,235,226,.09); --card-rule:rgba(210,235,226,.08);
  --margin:#C95A69; --ink:#E9F1EE; --muted:#9CB1AA; --line:rgba(210,235,226,.16); --pen:#9DB5FF; --pen-soft:rgba(157,181,255,.16);
  --red:#FF857C; --red-soft:rgba(255,133,124,.13); --ok:#62D9A2; --ok-soft:rgba(98,217,162,.13);
  --hl-1:#2E5627; --hl-2:#674A17; --hl-3:#68294A; --lv-1:#74C96A; --lv-2:#F2B13F; --lv-3:#F27DB8; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}

}
.app{max-width:760px; margin:0 auto; padding-block:24px 64px}
button{font:inherit}
:focus-visible{outline:3px solid var(--pen); outline-offset:2px}

/* En-tête */
.hd{display:grid; gap:2px; margin-bottom:8px}

.mode-d{line-height:28px; font-size:15px}

/* Tableau de la liste */
.vt-wrap{overflow-x:auto; border-radius:8px; box-shadow:0 1px 2px var(--shadow), 0 8px 20px var(--shadow)}
.vt{background:var(--sheet); min-width:300px}
.vt-row{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.1fr) 44px; gap:8px; align-items:center; padding:9px 14px; border-top:1px solid var(--line)}

.vt-row .f{overflow-wrap:anywhere}
.dots{display:flex; gap:4px; justify-content:flex-end}
.dots i{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--pen)}
.dots i.on{background:var(--pen)}

/* Barre des jeux */
.bar{display:flex; align-items:center; gap:14px; margin:0 0 20px; flex-wrap:wrap}
.bar h2{font-family:var(--f-display); font-weight:400; font-size:34px; margin:0; color:var(--pen); line-height:1}
.bar .meta{margin-left:auto; color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums}
.ctrls{display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:18px}
.ctrls.center{justify-content:center}

/* Cartes */
.flash{perspective:1400px}
.flip{display:grid; cursor:pointer; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.7,.25,1); border-radius:6px}

.face{grid-area:1 / 1; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; padding:0 22px 22px; min-height:320px}
.back{transform:rotateY(180deg)}
.fbody{flex:1; display:grid; place-items:center; align-content:center; gap:6px; text-align:center; padding-block:20px 6px}
.big{font-family:var(--f-display); font-size:clamp(52px,15vw,84px); line-height:1; color:var(--ink); overflow-wrap:anywhere}
.frl{font-size:19px; color:var(--muted)}
.hint{font-size:13px; color:var(--muted); margin-top:18px}
.forms{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:26px}
.form{display:grid; gap:2px}
.flab{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.fw{font-family:var(--f-display); font-size:clamp(28px,6vw,36px); line-height:1.1; color:var(--pen); overflow-wrap:anywhere}

@media (max-width:520px){
  .forms{grid-template-columns:1fr; gap:8px}

  .form .fw{text-align:right}
}

/* Quiz */
.qcard,.copy,.result,.intro{padding:0 20px 22px}
.prompt{font-size:21px; line-height:30px; margin:22px 0 18px; text-wrap:balance}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.opts.wide{grid-template-columns:1fr}
@media (max-width:480px){ .opts{grid-template-columns:1fr} }
.opt{font-size:18px; font-weight:500; text-align:left; padding:10px 14px; min-height:56px; border-radius:10px; border:1.5px solid var(--line); background:var(--sheet); color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:12px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt .k{font-size:12px; font-weight:600; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:var(--muted)}
.opt .t{min-width:0; overflow-wrap:anywhere}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.good .k{border-color:var(--ok); color:var(--ok)}

.opt.bad .t{text-decoration:line-through; text-decoration-color:var(--red)}
.fb{margin-top:16px; display:grid; gap:6px; justify-items:start}
.fb:empty{display:none}
.remark{font-family:var(--f-hand); font-size:32px; font-weight:700; line-height:1}
.remark.ok{color:var(--ok)} .remark.ko{color:var(--red)}
.fullline{font-size:16px}

.streak{font-family:var(--f-hand); font-size:22px; font-weight:700; color:var(--ok); transform:rotate(-2deg)}

/* Contrôle */
.lead{font-size:16px; line-height:28px; margin:20px 0 16px; max-width:60ch}
.intro .label{margin:6px 0 10px}
.intro .fine{margin:14px 0 4px}
.given{margin:20px 0 4px; display:grid; gap:0}
.gval{font-family:var(--f-display); font-size:clamp(36px,10vw,52px); line-height:1.1; color:var(--ink); overflow-wrap:anywhere}
.fields{display:grid; gap:14px; margin-top:16px}
.field{display:grid; gap:4px}
.field label{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.inp{font-family:var(--f-body); font-size:20px; font-weight:500; padding:10px 14px; min-height:52px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--pen); width:100%}
.inp:focus{outline:none; border-color:var(--pen); box-shadow:0 0 0 3px var(--pen-soft)}
.field.good .inp{border-color:var(--ok); background:var(--ok-soft); color:var(--ink)}

/* Résultats */
.result{text-align:center}

.grade svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}

@keyframes draw{from{stroke-dashoffset:700} to{stroke-dashoffset:0}}
.grade span{font-family:var(--f-hand); font-weight:700; font-size:62px; color:var(--red); line-height:1; font-variant-numeric:tabular-nums}
.verdict{font-family:var(--f-hand); font-size:28px; font-weight:700; color:var(--red); margin:0 0 6px}
.result .sum{margin:0 0 6px}
.misses{text-align:left; margin-top:18px; display:grid; gap:0; border-top:1px solid var(--line)}
.miss{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:10px 2px; border-bottom:1px solid var(--line)}
.miss b{font-weight:600}
.miss .muted{font-size:14px}

/* Ma liste */
.lvl-sec{margin:24px 0}
.lvl-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.vchips{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.star{display:inline-block; width:.9em; height:.9em; fill:var(--red); vertical-align:-.1em; margin-left:.3em; flex:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.sub{font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--muted); margin:16px 0 8px}
.legend{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
.legend .star{margin-left:0}
.vchip{position:relative; text-align:left; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--sheet); color:var(--ink); cursor:pointer; display:grid; min-height:54px; align-content:center}
.vchip b{font-weight:600; font-size:16px}
.vchip small{color:var(--muted); font-size:12.5px; overflow-wrap:anywhere}
.vchip{border:2px solid var(--lv); padding-right:36px}
.vchip:hover{box-shadow:0 0 0 1px var(--lv)}
.vchip[aria-pressed="true"]{background:var(--hl); box-shadow:inset 0 0 0 1px var(--lv)}
.vchip .ck{position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; border:2px solid var(--lv); display:grid; place-items:center; background:var(--sheet)}
.vchip .ck svg{width:12px; height:12px; fill:none; stroke:var(--sheet); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.vchip[aria-pressed="true"] .ck{background:var(--ink); border-color:var(--ink)}
.vchip[aria-pressed="true"] .ck svg{opacity:1}
.legend-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; font-size:13px; color:var(--muted); margin-top:4px}
.lg{display:inline-flex; align-items:center; gap:6px}
.lg i{width:18px; height:14px; border-radius:4px; border:2px solid var(--lv); background:var(--sheet)}
.lg .star{margin-left:0}
.vchip[aria-pressed="true"] small{color:var(--ink)}
.counter{background:var(--sheet); border-radius:8px; padding:14px 16px; box-shadow:0 1px 2px var(--shadow); display:grid; gap:4px}
.counter strong{font-family:var(--f-display); font-weight:400; font-size:26px; color:var(--pen); line-height:1.1}

.foot{margin-top:40px; display:grid; gap:4px; justify-items:start}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>

<script>
(() => {
"use strict";

/* Les 105 verbes de la fiche : 65 avec étoile (RAW), 40 sans (NOSTAR). [base, prétérit, participe, traduction, niveau, astuce, options]
   "a|b" = deux réponses acceptées ; "a, b" = deux formes à écrire (was, were). */
const RAW = [
  ["cut","cut","cut","couper",1,"Les trois formes sont identiques : cut, cut, cut."],
  ["put","put","put","mettre",1,"Les trois formes sont identiques : put, put, put."],
  ["let","let","let","laisser, permettre",1,"Les trois formes sont identiques : let, let, let."],
  ["shut","shut","shut","fermer",1,"Les trois formes sont identiques : shut, shut, shut."],
  ["cost","cost","cost","coûter",1,"Les trois formes sont identiques : cost, cost, cost."],
  ["read","read","read","lire",1,"Ça s'écrit pareil, mais au prétérit et au participe on prononce « red »."],
  ["have","had","had","avoir",1,"had dans les deux colonnes."],
  ["make","made","made","faire, fabriquer",1,"On remplace le k par un d : made, made."],
  ["say","said","said","dire",1,"said se prononce « sed ». On dit say something, et tell someone.",{q:"dire (quelque chose)"}],
  ["pay","paid","paid","payer",1,"paid, et surtout pas payed !"],
  ["meet","met","met","rencontrer",1,"Le ee devient un seul e : met, met."],
  ["sit","sat","sat","être assis",1,"Le i devient a : sat, sat.",{ok:["s'asseoir"]}],
  ["sleep","slept","slept","dormir",1,"Le ee devient e et on ajoute un t : slept."],
  ["keep","kept","kept","garder",1,"Comme sleep : le ee devient e et on ajoute un t."],
  ["feel","felt","felt","(se) sentir, éprouver",1,"Le ee devient e et on ajoute un t : felt."],
  ["mean","meant","meant","signifier",1,"On ajoute juste un t : meant (ça se prononce « ment »).",{ok:["vouloir dire"]}],
  ["learn","learnt|learned","learnt|learned","apprendre",1,"learnt ou learned : les deux sont justes."],

  if (!s.m || typeof s.m !== "object") s.m = {};
  if (!["all","1","2","3"].includes(s.f)) s.f = "all";
  if (!["mix","base","fr"].includes(s.cm)) s.cm = "mix";
  if (!["all","star","nostar"].includes(s.lf)) s.lf = "all";

}

}

/* Correction en anglais : majuscules, « to » et « up » ignorés ; was/were demande les deux. */
function tokensEN(s){
  return s.toLowerCase().replace(/[’']/g, "").replace(/[()]/g, " ").split(/[\s,\/;+&.]+/)
    .filter(t => t && !["up","to","and","et","ou","or"].includes(t));
}
function checkEN(ans, field){
  const groups = field.split(",").map(g => g.split("|").map(s => s.trim().toLowerCase()));
  const toks = tokensEN(ans);
  if (!toks.length) return {ok:false, empty:true};
  const all = groups.flat();
  const clean = toks.every(t => all.includes(t));
  const ok = clean && groups.every(g => g.some(a => toks.includes(a)));
  const partial = !ok && clean && groups.length > 1;
  return {ok, partial};
}
/* Correction en français : accents, « se » et parenthèses ignorés. */
const fold = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’`´]/g, "'").replace(/[^a-z' ]+/g, " ").replace(/\s+/g, " ").trim();
const frKey = s => fold(s).replace(/^(se |s')/, "").replace(/^to /, "").trim();
function frAccepted(v){
  const out = new Set();
  const add = s => { const k = frKey(s); if (k) out.add(k); };
  (v.ok || []).forEach(add);
  v.fr.split(/,(?![^(]*\))/).forEach(p => { add(p.replace(/\([^)]*\)/g, " ")); add(p.replace(/[()]/g, " ")); });
  if (v.q) add(v.q.replace(/\([^)]*\)/g, " "));
  return out;
}
function checkFR(ans, v){
  const acc = frAccepted(v);
  const parts = ans.split(/[,;\/]| ou /i).map(frKey).filter(Boolean);
  if (!parts.length) return {ok:false, empty:true};
  return {ok: parts.some(p => acc.has(p))};
}

/* Mauvaises réponses plausibles : les erreurs que font vraiment les élèves. */
function regular(v){
  if (v.reg) return v.reg;
  const b = v.base;
  if (/e$/.test(b)) return b + "d";
  if (/[^aeiou]y$/.test(b)) return b.slice(0, -1) + "ied";
  if (/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(b)) return b + b.slice(-1) + "ed";
  return b + "ed";
}
function mutate(f){
  const o = [];
  if (f.includes("ought")) o.push(f.replace("ought", "aught"));
  if (f.includes("aught")) o.push(f.replace("aught", "ought"));
  const m = f.match(/([a-z])\1/);
  if (m) o.push(f.replace(m[0], m[1]));
  return o;
}
function formDistractors(v, col){
  const right = first(v[col]);
  const other = first(v[col === "pret" ? "pp" : "pret"]);
  const pri = [regular(v), ...mutate(right)];
  if (other !== right) pri.push(other);
  if (col === "pp" && v.lvl > 1 && !right.endsWith("en")) { const p = first(v.pret); if (!p.includes(",")) pri.push(/e$/.test(p) ? p + "n" : p + "en"); }
  ((v.x && v.x[col]) || []).forEach(x => pri.push(x));
  const tail = [];
  if (v.base !== right) tail.push(v.base);
  const same = shuffle(VERBS.filter(x => x !== v && x.lvl === v.lvl)).map(x => first(x[col]));
  const out = [];
  for (const d of [...shuffle(pri), ...tail, ...same]) {
    if (!d || out.includes(d) || d === right) continue;
    const r = checkEN(d, v[col]);
    if (r.ok || r.partial) continue;
    out.push(d);
    if (out.length >= 6) break;
  }
  return out;
}

/* Prononciation, si l'appareil a une voix anglaise */
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function speak(v){
  if (!canSpeak || !v) return;
  try {
    const txt = [v.base, first(v.pret), first(v.pp)].map(s => v.up ? s + " up" : s).join(", ");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "en-GB"; u.rate = .82;
    const vs = speechSynthesis.getVoices();
    const voice = vs.find(x => /^en[-_]GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch(e) {}
}

function renderCards(){
  const v = BY[K.deck[K.i]], n = K.deck.length, L = LVL[v.lvl];
  const head = `<span class="fhead"><span class="tag ${L.cls}">${L.name}</span><span class="fine push">${K.i + 1} / ${n}</span></span>`;
  show("cards", `${bar("Cartes", `${K.i + 1} / ${n}`)}
    <div class="flash">
      <div class="flip${K.on ? " on" : ""}" id="flip" role="button" tabindex="0" data-act="flip" aria-label="Retourner la carte">
        <div class="face front bristol" aria-hidden="${K.on}">
          ${head}
          <div class="fbody"><span class="big">${esc(D(v, "base"))}</span><span class="frl">${esc(v.fr)}</span><span class="hint">Touche la carte pour voir la réponse</span></div>
        </div>
        <div class="face back bristol" aria-hidden="${!K.on}">
          ${head}
          <div class="forms">${["base", "pret", "pp"].map(c => `<div class="form"><span class="flab">${COLS[c]}</span><span class="fw">${esc(D(v, c))}</span></div>`).join("")}</div>
          <span class="frl">${esc(v.fr)}</span>
          ${v.tip ? `<span class="tip">${esc(v.tip)}</span>` : ""}
        </div>
      </div>
    </div>
    <div class="ctrls">
      <button class="btn" type="button" data-act="prev" ${K.i === 0 ? "disabled" : ""}>← Précédente</button>
      ${spkBtn(v)}
      <button class="btn primary" type="button" data-act="next">${K.i < n - 1 ? "Suivante →" : "Recommencer"}</button>
    </div>
    <div class="ctrls center"><button class="btn ghost" type="button" data-act="shuffle">Mélanger les cartes</button></div>`);
}
function flip(){
  K.on = !K.on;
  const f = document.getElementById("flip");
  if (!f) return;
  f.classList.toggle("on", K.on);
  f.querySelector(".front").setAttribute("aria-hidden", K.on);
  f.querySelector(".back").setAttribute("aria-hidden", !K.on);
}

/* ---------- quiz ---------- */
let Q = null;
function weighted(pool){
  const w = pool.map(v => 4 - mOf(v));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r < 0) return pool[i]; }
  return pool[pool.length - 1];
}
function makeQ(v){
  const type = pick(["pret", "pp", "triple", "fr"]);
  let prompt, opts;
  if (type === "pret" || type === "pp") {
    const right = first(v[type]);
    opts = [{t: right, ok: true}, ...formDistractors(v, type).slice(0, 3).map(t => ({t, ok: false}))];
    prompt = `Le <strong>${type === "pret" ? "prétérit" : "participe passé"}</strong> de <span class="w">${esc(D(v, "base"))}</span>&nbsp;?`;
  } else if (type === "triple") {
    const R = [v.base, first(v.pret), first(v.pp)];
    const c = [];
    formDistractors(v, "pret").forEach(d => c.push([R[0], d, R[2]]));
    formDistractors(v, "pp").forEach(d => c.push([R[0], R[1], d]));
    c.push([R[0], regular(v), regular(v)]);
    c.push([R[0], R[2], R[1]]);
    const seen = new Set([R.join(" – ")]), wrong = [];
    for (const t of shuffle(c)) {
      const k = t.join(" – ");
      if (seen.has(k)) continue;
      if (checkEN(t[1], v.pret).ok && checkEN(t[2], v.pp).ok) continue;
      seen.add(k); wrong.push(k);
      if (wrong.length === 3) break;
    }
    opts = [{t: R.join(" – "), ok: true}, ...wrong.map(t => ({t, ok: false}))];
    prompt = `Quelle ligne est juste pour <span class="w">« ${esc(frQ(v))} »</span>&nbsp;?`;
  } else {
    const acc = frAccepted(v);
    const ok = x => x !== v && ![...frAccepted(x)].some(k => acc.has(k));
    const pool = [...shuffle(selected().filter(ok)), ...shuffle(VERBS.filter(x => ok(x) && !S.sel.includes(x.id) && x.lvl === v.lvl))];
    opts = [{t: D(v, "base"), ok: true}, ...pool.slice(0, 3).map(x => ({t: D(x, "base"), ok: false}))];
    prompt = `Comment dit-on <span class="w">« ${esc(frQ(v))} »</span> en anglais&nbsp;?`;
  }
  return {v, type, prompt, opts: shuffle(opts)};
}
function startQuiz(){
  const pool = filtered(), qs = [];
  let last = null;
  for (let i = 0; i < 10; i++) {
    let v, tries = 0;
    do { v = weighted(pool); tries++; } while (pool.length > 1 && v === last && tries < 10);
    last = v; qs.push(makeQ(v));
  }
  Q = {qs, i: 0, score: 0, streak: 0, best: 0, done: false, wrong: []};
  renderQuiz();
}
function renderQuiz(){
  const q = Q.qs[Q.i], L = LVL[q.v.lvl];
  show("quiz", `${bar("Quiz", `Question ${Q.i + 1} / ${Q.qs.length}`)}
    <div class="qcard bristol">
      <div class="fhead"><span class="tag ${L.cls}">${L.name}</span><span class="streak" id="streak" ${Q.streak < 2 ? "hidden" : ""}>Série de ${Q.streak} !</span><span class="score push" id="qscore">${Q.score} / ${Q.i} juste${Q.score > 1 ? "s" : ""}</span></div>
      <p class="prompt">${q.prompt}</p>
      <div class="opts${q.type === "triple" ? " wide" : ""}">${q.opts.map((o, i) => `<button class="opt" type="button" data-act="answer" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span class="t">${esc(o.t)}</span></button>`).join("")}</div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <div class="ctrls"><span></span><button class="btn primary" type="button" id="qnext" data-act="qnext" hidden>${Q.i < Q.qs.length - 1 ? "Question suivante →" : "Voir ma note"}</button></div>`);
}
function answer(i){
  if (Q.done) return;
  Q.done = true;
  const q = Q.qs[Q.i], ok = q.opts[i].ok;
  const btns = screen.querySelectorAll(".opt");
  btns.forEach((b, k) => { b.disabled = true; if (q.opts[k].ok) b.classList.add("good"); else if (k === i) b.classList.add("bad"); });
  if (ok) { Q.score++; Q.streak++; Q.best = Math.max(Q.best, Q.streak); }
  else { Q.streak = 0; if (!Q.wrong.includes(q.v)) Q.wrong.push(q.v); }
  const st = document.getElementById("streak");
  st.hidden = Q.streak < 2; st.textContent = `Série de ${Q.streak} !`;
  document.getElementById("qscore").textContent = `${Q.score} / ${Q.i + 1} juste${Q.score > 1 ? "s" : ""}`;
  document.getElementById("fb").innerHTML = `<span class="remark ${ok ? "ok" : "ko"}">${pick(ok ? GOOD : BAD)}</span>${fullLine(q.v)}${!ok && q.v.tip ? `<span class="tip">${esc(q.v.tip)}</span>` : ""}${spkBtn(q.v, "btn small")}`;
  const nx = document.getElementById("qnext");
  nx.hidden = false; nx.focus({preventScroll: true});
}
function quizEnd(){
  const note = Q.score * 2;
  show("quiz-end", `${bar("Quiz", "Terminé")}
    <div class="result bristol">
      <div class="fhead"><span class="fine">Résultat</span></div>
      ${grade(note)}
      <p class="verdict">${verdict(note)}</p>
      <p class="sum">${Q.score} bonne${Q.score > 1 ? "s" : ""} réponse${Q.score > 1 ? "s" : ""} sur 10${Q.best >= 2 ? ` · meilleure série : ${Q.best}` : ""}.</p>
      ${Q.wrong.length ? `<div class="misses"><p class="label" style="padding:12px 2px 4px">À revoir</p>${Q.wrong.map(v => `<div class="miss">${fullLine(v)}</div>`).join("")}</div>` : ""}
      <div class="ctrls center"><button class="btn" type="button" data-act="home">Accueil</button><button class="btn primary" type="button" data-act="quiz">Rejouer</button></div>
    </div>`);
}

/* ---------- contrôle ---------- */
let C = null;
function controlIntro(){
  const n = filtered().length;
  show("control-intro", `${bar("Contrôle", `${n} verbes`)}
    <div class="intro bristol">
      <div class="fhead"><span class="label">Consigne</span></div>
      <p class="lead">Pour chaque verbe, écris les formes qui manquent. À la fin, tu as ta note sur 20 et la liste de tes erreurs.</p>
      <p class="label" id="cm-lab">On te donne</p>
      <div class="chips" role="group" aria-labelledby="cm-lab">${[["mix", "Un peu des deux"], ["base", "Le verbe anglais"], ["fr", "La traduction"]].map(([k, t]) => `<button class="chip" type="button" data-act="cm" data-cm="${k}" aria-pressed="${S.cm === k}">${t}</button>`).join("")}</div>
      <p class="fine">Les accents ne comptent pas dans la traduction. Pour be, écris les deux formes du prétérit : was, were.</p>
      <div class="ctrls"><span></span><button class="btn primary" type="button" data-act="cstart">Commencer le contrôle</button></div>
    </div>`);
}
function startControl(ids){
  const list = ids && ids.length ? ids.map(id => BY[id]) : filtered();
  C = {q: shuffle(list).map(v => ({v, pt: S.cm === "mix" ? (Math.random() < .5 ? "base" : "fr") : S.cm})), i: 0, ok: 0, total: 0, res: [], checked: false};
  renderCItem();
}
function cFields(it){ return it.pt === "base" ? ["pret", "pp", "fr"] : ["base", "pret", "pp"]; }
function renderCItem(){
  const it = C.q[C.i], v = it.v, L = LVL[v.lvl], fields = cFields(it), given = it.pt === "base" ? "base" : "fr";
  show("control", `${bar("Contrôle", `Verbe ${C.i + 1} / ${C.q.length}`)}
    <form class="copy bristol" id="cform" autocomplete="off" novalidate>
      <div class="fhead"><span class="tag ${L.cls}">${L.name}</span><span class="fine push">${C.i + 1} / ${C.q.length}</span></div>
      <div class="given"><span class="flab">${COLS[given]}</span><span class="gval">${esc(given === "base" ? D(v, "base") : frQ(v))}</span></div>
      <div class="fields">${fields.map((f, k) => `<div class="field" id="fd-${f}"><label for="c-${f}">${COLS[f]}</label><input class="inp" id="c-${f}" data-f="${f}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${k < fields.length - 1 ? "next" : "done"}" lang="${f === "fr" ? "fr" : "en"}"><span class="fix" hidden></span></div>`).join("")}</div>
      <div class="cfb" id="cfb" aria-live="polite"></div>
      <div class="ctrls"><span></span><button class="btn primary" type="submit" id="cbtn">Valider</button></div>
    </form>`);
  const f0 = document.getElementById("c-" + fields[0]);
  if (f0) setTimeout(() => f0.focus({preventScroll: true}), 30);
}
function checkC(){
  const it = C.q[C.i], v = it.v, fields = cFields(it);
  let n = 0;
  fields.forEach(f => {
    const el = document.getElementById("c-" + f), fd = document.getElementById("fd-" + f), fx = fd.querySelector(".fix");
    const r = f === "fr" ? checkFR(el.value, v) : checkEN(el.value, f === "base" ? v.base : v[f]);
    el.readOnly = true;
    fd.classList.add(r.ok ? "good" : "bad");
    fx.hidden = false;
    fx.textContent = r.ok ? "✓" : r.partial ? `Il faut les deux : ${corr(v, f)}` : `→ ${corr(v, f)}`;
    if (r.ok) n++;
  });
  const all = n === fields.length, before = mOf(v);
  S.m[v.id] = all ? Math.min(3, before + 1) : Math.max(0, before - 1);
  save();
  C.ok += n; C.total += fields.length;
  C.res.push({v, all});
  const full = all && S.m[v.id] === 3 && before < 3;
  document.getElementById("cfb").innerHTML = all
    ? `<span class="remark ok">${pick(GOOD)}</span>${full ? `<span class="fullline">Case pleine : <b>${esc(v.base)}</b> est maîtrisé.</span>` : ""}${spkBtn(v, "btn small")}`
    : `<span class="remark ko">${pick(BAD)}</span>${fullLine(v)}${v.tip ? `<span class="tip">${esc(v.tip)}</span>` : ""}${spkBtn(v, "btn small")}`;
  C.checked = true;
  const b = document.getElementById("cbtn");
  b.textContent = C.i < C.q.length - 1 ? "Verbe suivant →" : "Voir ma note";
  b.focus({preventScroll: true});
}
function nextC(){
  C.i++; C.checked = false;
  if (C.i >= C.q.length) cResults(); else renderCItem();
}
function cResults(){
  const note = Math.round(C.ok / C.total * 40) / 2;
  const miss = C.res.filter(r => !r.all).map(r => r.v);
  C.miss = miss.map(v => v.id);
  const nOk = C.res.length - miss.length;
  show("control-end", `${bar("Contrôle", "Terminé")}
    <div class="result bristol">
      <div class="fhead"><span class="fine">Copie corrigée</span></div>
      ${grade(note)}
      <p class="verdict">${verdict(note)}</p>
      <p class="sum">${nOk} verbe${nOk > 1 ? "s" : ""} sans faute sur ${C.res.length}.</p>
      ${miss.length ? `<div class="misses"><p class="label" style="padding:12px 2px 4px">À revoir</p>${miss.map(v => `<div class="miss">${fullLine(v)}</div>`).join("")}</div>` : ""}
      <div class="ctrls center">
        <button class="btn" type="button" data-act="home">Accueil</button>
        ${miss.length ? `<button class="btn" type="button" data-act="cretry">Refaire mes erreurs (${miss.length})</button>` : ""}
        <button class="btn primary" type="button" data-act="cstart">Nouveau contrôle</button>
      </div>
    </div>
    ${progress()}`);
}

/* ---------- choix des verbes ---------- */
function listScreen(focusId){
  const y = window.scrollY;
  const sel = selected(), cnt = {1:0, 2:0, 3:0};
  sel.forEach(v => cnt[v.lvl]++);
  const selStar = sel.filter(v => v.star).length;
  const nStar = VERBS.filter(v => v.star).length;
  const vis = v => S.lf === "all" || (S.lf === "star") === v.star;
  const chip = v => `<button class="vchip ${LVL[v.lvl].cls}" type="button" data-act="toggle" data-id="${v.id}" aria-pressed="${S.sel.includes(v.id)}"><span class="ck" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>${esc(D(v, "base"))}${v.star ? STAR : ""}<span class="sr"> (${LVL[v.lvl].name})</span></b><small>${esc(first(v.pret))} · ${esc(first(v.pp))}</small></button>`;
  const lfs = [["all", `Tous · ${VERBS.length}`], ["star", `Avec étoile · ${nStar}`], ["nostar", `Sans étoile · ${VERBS.length - nStar}`]];
  show("list", `${bar("Ma liste", `${sel.length} choisis`)}
    <div class="counter">
      <strong>${sel.length} verbe${sel.length > 1 ? "s" : ""} choisi${sel.length > 1 ? "s" : ""}</strong>
      <span class="fine">dont ${selStar} avec étoile · ${cnt[1]} faciles · ${cnt[2]} moyens · ${cnt[3]} durs</span>
      <div class="legend-row"><span class="lg l1"><i></i>Facile</span><span class="lg l2"><i></i>Moyen</span><span class="lg l3"><i></i>Dur</span><span class="lg">${STAR} étoile sur la fiche, à travailler en priorité</span></div>
      <span class="fine">La consigne : 15 verbes au choix, de préférence avec une étoile. Touche un verbe pour l'ajouter ou l'enlever.</span>
    </div>
    <section class="sec" style="margin:22px 0 0">
      <p class="label" id="lf-lab">Afficher</p>
      <div class="chips" role="group" aria-labelledby="lf-lab">${lfs.map(([k, t]) => `<button class="chip" type="button" data-act="lf" data-lf="${k}" aria-pressed="${S.lf === k}">${t}</button>`).join("")}</div>
    </section>
    <section class="lvl-sec"><div class="vchips">${[...VERBS].filter(vis).sort((a, b) => a.base.localeCompare(b.base)).map(chip).join("")}</div></section>
    <div class="ctrls">
      <button class="btn" type="button" data-act="defsel">Reprendre la sélection proposée</button>
      <button class="btn primary" type="button" data-act="home">C'est bon</button>
    </div>`);
  if (focusId) {
    window.scrollTo(0, y);
    const b = screen.querySelector(`[data-act="toggle"][data-id="${focusId}"]`);
    if (b) b.focus({preventScroll: true});
  }
}

/* ---------- actions ---------- */
let armTimer = null;
function act(a, el){
  switch (a) {
    case "home": home(); break;
    case "filter": S.f = el.dataset.f; save(); home(true); break;
    case "cards": startCards(); break;
    case "flip": flip(); break;
    case "prev": if (K.i > 0) { K.i--; K.on = false; renderCards(); } break;
    case "next": K.i = K.i < K.deck.length - 1 ? K.i + 1 : 0; K.on = false; renderCards(); break;
    case "shuffle": K.deck = shuffle(K.deck); K.i = 0; K.on = false; renderCards(); break;
    case "speak": speak(BY[el.dataset.id]); break;
    case "quiz": startQuiz(); break;
    case "answer": answer(+el.dataset.i); break;
    case "qnext": Q.i++; Q.done = false; if (Q.i >= Q.qs.length) quizEnd(); else renderQuiz(); break;
    case "control": controlIntro(); break;
    case "cm": S.cm = el.dataset.cm; save(); screen.querySelectorAll('[data-act="cm"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.cm === S.cm)); break;
    case "cstart": startControl(); break;
    case "cretry": startControl(C.miss); break;
    case "list": listScreen(); break;
    case "toggle": {
      const id = el.dataset.id, i = S.sel.indexOf(id);
      if (i >= 0) { if (S.sel.length > 1) S.sel.splice(i, 1); } else S.sel.push(id);
      save(); listScreen(id); break;
    }
    case "defsel": S.sel = [...DEFAULT]; save(); listScreen(); break;
    case "lf": S.lf = el.dataset.lf; save(); listScreen(); break;
    case "reset": {
      if (el.dataset.armed) { S.m = {}; save(); clearTimeout(armTimer); home(); }
      else {
        el.dataset.armed = "1"; el.textContent = "Sûr ? Touche encore pour tout effacer";
        clearTimeout(armTimer);
        armTimer = setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Remettre les compteurs à zéro"; } }, 5000);
      }
      break;
    }
  }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  act(t.dataset.act, t);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "cform") return;
  e.preventDefault();
  if (C.checked) nextC(); else checkC();
});
document.addEventListener("keydown", e => {
  if (cur === "cards") {
    if (e.key === "ArrowRight") act("next");
    else if (e.key === "ArrowLeft" && K.i > 0) act("prev");
    else if ((e.key === " " || e.key === "Enter") && e.target.id === "flip") { e.preventDefault(); flip(); }
  } else if (cur === "quiz" && Q && !Q.done) {
    const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (e.key.length === 1 && i >= 0 && i < Q.qs[Q.i].opts.length) answer(i);
  } else if (cur === "control" && e.key === "Enter" && e.target.matches && e.target.matches(".inp") && !C.checked) {
    const inputs = [...screen.querySelectorAll(".inp")];
    const k = inputs.indexOf(e.target);
    if (k < inputs.length - 1) { e.preventDefault(); inputs[k + 1].focus(); }
  }
});
if (canSpeak) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e) {} }

home();
})();
</script>
